{
  "name": "Validate migration policy",
  "on": {
    "pull_request": {
      "branches": [
        "master"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "policy": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "name": "Read repository",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1,
            "clean": false
          }
        },
        {
          "name": "Check local CI isolation and negative cases",
          "run": "python3 -B .github/ci/check_policy.py --self-test"
        },
        {
          "name": "Use pinned Node",
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "24.21.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Install reviewed lockfile without lifecycle scripts",
          "run": "npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org"
        },
        {
          "name": "Build and test static foundation",
          "run": "npm run build && npm test"
        }
      ]
    }
  }
}
